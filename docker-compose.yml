services:
  syncplus-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: syncplus-web
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - .:/app
      - syncplus_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true

volumes:
  syncplus_node_modules:
